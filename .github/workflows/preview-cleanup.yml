name: Destroy preview

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  pull-requests: write

# Shares the Deploy workflow's group so a destroy never overlaps a deploy of the same PR.
concurrency:
  group: deploy-pr-${{ github.event.number }}
  cancel-in-progress: false

env:
  STAGE: pr-${{ github.event.number }}

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: Destroy preview
    runs-on: ubuntu-latest
    env:
      PULL_REQUEST: ${{ github.event.pull_request.number }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Refuse to destroy production
        run: |
          if [[ ! "$PULL_REQUEST" =~ ^[0-9]+$ || "$STAGE" != "pr-${PULL_REQUEST}" ]]; then
            echo "Refusing to destroy unexpected stage '$STAGE' for PR '$PULL_REQUEST'."
            exit 1
          fi

      - name: Inspect preview resources
        id: preview-plan
        run: |
          plan="$(bunx varlock run --path ../../.env.schema -- bunx alchemy destroy --stage "$STAGE" --dry-run --no-input)"
          printf '%s\n' "$plan"

          expected_resources="$(printf '%s\n' \
            Database \
            DigitalBucket \
            MediaBucket \
            preview-comment \
            Web | sort)"
          actual_resources="$(printf '%s\n' "$plan" | \
            sed -E 's/\x1B\[[0-9;]*[[:alpha:]]//g' | \
            sed -nE 's/^.*\[([^]]+)\] delete$/\1/p' | sort)"

          if [[ "$actual_resources" != "$expected_resources" ]]; then
            echo "Refusing to destroy unexpected preview resources."
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected_resources" "$actual_resources"
            exit 1
          fi
        env:
          APP_ENV: development
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        working-directory: packages/infra

      - name: Destroy preview
        run: bunx varlock run --path ../../.env.schema -- bunx alchemy destroy --stage "$STAGE" --yes
        working-directory: packages/infra
        env:
          APP_ENV: development
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
