name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Concurrency lives on each job: a new push cancels stale checks, but never a deploy halfway through.
jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-latest
    concurrency:
      group: ci-quality-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run lint and formatting checks
        run: bun run check

      - name: Build workspace
        run: bun run build
        # Varlock reads the Turborepo remote cache credentials from 1Password (.env.turbo) and strips this token before running turbo.
        # Fork PRs get no secrets and fall back to a cold local cache.
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Run type checks
        run: bun run check-types
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Run package tests
        run: bun run test
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Run integration tests
        run: bun run test:integration

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    concurrency:
      group: ci-e2e-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: bunx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Run E2E tests
        run: bun run test:e2e
        # Varlock reads STRIPE_SECRET_KEY from the E2E item in 1Password; every other e2e value is a placeholder in .env.schema.
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            packages/infra/.alchemy/log/e2e/
          retention-days: 14

  deploy:
    needs: [quality, e2e]
    if: >-
      github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    # preview-cleanup.yml shares this group so a destroy never overlaps a deploy of the same PR.
    concurrency:
      group: deploy-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'production' }}
      cancel-in-progress: false
    env:
      STAGE: >-
        ${{ github.event_name == 'pull_request'
          && format('pr-{0}', github.event.number)
          || (github.ref == 'refs/heads/main' && 'production' || github.ref_name) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy
        run: |
          args=(--stage "$STAGE" --yes)
          if [[ "$STAGE" == "production" ]]; then
            args+=(--adopt)
          fi
          bunx varlock run --path ../../.env.schema -- bunx alchemy deploy "${args[@]}"
        working-directory: packages/infra
        env:
          APP_ENV: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
