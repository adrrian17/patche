name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run lint and formatting checks
        run: bun run check

      - name: Build workspace
        run: bun run build
        # Placeholders so Varlock validates without 1Password; CI never deploys this build.
        env:
          BETTER_AUTH_SECRET: ci-placeholder-better-auth-secret-000000
          R2_ACCESS_KEY_ID: ci-placeholder-r2-access-key-id
          R2_SECRET_ACCESS_KEY: ci-placeholder-r2-secret-access-key
          STRIPE_SECRET_KEY: sk_test_ci_placeholder_000000000000
          STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder_0000000000000

      - name: Run type checks
        run: bun run check-types

      - name: Run package tests
        run: bun test apps/web packages/email packages/payments packages/storage
