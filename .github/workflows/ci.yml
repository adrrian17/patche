name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run lint and formatting checks
        run: bun run check

      - name: Build workspace
        run: bun run build
        # Varlock reads the Turborepo remote cache credentials from 1Password (.env.turbo) and strips this token before running turbo.
        # Fork PRs get no secrets and fall back to a cold local cache.
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Run type checks
        run: bun run check-types
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Run package tests
        run: bun run test
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Run integration tests
        run: bun run test:integration

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: bunx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Run E2E tests
        run: bun run test:e2e
        # Varlock reads the Stripe keys from the E2E item in 1Password (.env.schema). The other values run on local D1 and the Alchemy email simulator, so placeholders are enough.
        # `alchemy dev` in CI insists on Cloudflare credentials but never calls the API for local resources.
        env:
          CLOUDFLARE_ACCOUNT_ID: "00000000000000000000000000000000"
          CLOUDFLARE_API_TOKEN: ci-placeholder
          BETTER_AUTH_SECRET: ci-placeholder-better-auth-secret-000000
          R2_ACCESS_KEY_ID: ci-placeholder-r2-access-key-id
          R2_SECRET_ACCESS_KEY: ci-placeholder-r2-secret-access-key
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            packages/infra/.alchemy/log/e2e/
          retention-days: 14
